<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ecological Lafferty</title>
  <style>html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#F8F8F4}iframe{display:block;width:100%;height:100%;border:0;visibility:hidden}</style>
</head>
<body>
  <iframe id="ecological-app" title="Ecological Lafferty research tool" allow="clipboard-write"></iframe>
  <script>
  (() => {
    const frame = document.getElementById('ecological-app');
    let revealTimer;
    function reveal() {
      frame.style.visibility = 'visible';
      window.clearTimeout(revealTimer);
    }
    revealTimer = window.setTimeout(reveal, 8000);
    const appUrl = new URL('./index.html', window.location.href);
    appUrl.search = window.location.search;
    appUrl.hash = window.location.hash;
    const directoryPath = new URL('./', appUrl).pathname;
    const stylesheetUrl = new URL('./editorial.css', window.location.href);
    const parameters = new URL(window.location.href).searchParams;
    const design = parameters.get('design');
    const version = design || parameters.get('v');
    if (version) stylesheetUrl.searchParams.set(design ? 'design' : 'v', version);

    function appWindow() {
      try {
        const child = frame.contentWindow;
        if (!child || child.location.origin !== appUrl.origin) return null;
        if (![appUrl.pathname, directoryPath].includes(child.location.pathname)) return null;
        return child;
      } catch (_) { return null; }
    }

    function mirrorChildHash() {
      const child = appWindow();
      if (!child || child.location.hash === window.location.hash) return;
      const address = new URL(window.location.href);
      address.hash = child.location.hash;
      window.history.replaceState(window.history.state, '', address.href);
    }

    frame.addEventListener('load', () => {
      const child = appWindow();
      if (!child) { reveal(); return; }
      const doc = child.document;
      doc.documentElement.classList.add('aae-editorial');
      if (!doc.getElementById('easterwine-editorial-stylesheet')) {
        const link = doc.createElement('link');
        link.id = 'easterwine-editorial-stylesheet';
        link.rel = 'stylesheet';
        link.href = stylesheetUrl.href;
        link.onload = reveal;
        link.onerror = reveal;
        doc.head.appendChild(link);
      } else { reveal(); }
      child.addEventListener('hashchange', mirrorChildHash);
      child.addEventListener('popstate', mirrorChildHash);
      doc.addEventListener('click', () => child.requestAnimationFrame(mirrorChildHash), true);
      mirrorChildHash();
    });

    window.addEventListener('hashchange', () => {
      const child = appWindow();
      if (!child || child.location.hash === window.location.hash) return;
      const target = new URL(child.location.href);
      target.hash = window.location.hash;
      child.location.replace(target.href);
    });
    frame.src = appUrl.href;
  })();
  </script>
</body>
</html>
